[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reasonsforge"
version = "0.71.0"
description = "Reasons Forge — automatic belief retraction and dependency-directed backtracking"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://reasonsforge.io"
Documentation = "https://reasonsforge.io"
Repository = "https://github.com/benthomasson/reasonsforge"

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pyyaml"]
pg = ["psycopg[binary]>=3.1"]
test-pg = ["psycopg[binary]>=3.1", "pytest", "pytest-cov"]
cluster = ["sentence-transformers>=2.2", "scikit-learn>=1.2"]
mcp = ["mcp>=1.0"]
api = ["langchain-anthropic>=0.3"]
vertex = ["langchain-google-vertexai>=2.0"]
langfuse = ["langfuse>=2.0"]
llm = ["langchain-anthropic>=0.3", "langchain-google-vertexai>=2.0", "langfuse>=2.0"]
forge = ["pypdf>=4.0", "requests>=2.28"]
forge-embeddings = ["fastembed>=0.7.4", "numpy"]

[project.scripts]
reasonsforge = "reasonsforge.cli:main"
reasonsforge-mcp = "reasonsforge.mcp_server:main"

[tool.setuptools]
packages = ["reasonsforge", "reasonsforge.forge", "reasonsforge.forge.code", "reasonsforge.forge.code.prompts", "reasonsforge.forge.diary", "reasonsforge.forge.project", "reasonsforge.forge.project.sources", "reasonsforge.forge.project.prompts", "reasonsforge.forge.product", "reasonsforge.forge.product.prompts", "reasonsforge.forge.meta", "reasonsforge.forge.meta.prompts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
